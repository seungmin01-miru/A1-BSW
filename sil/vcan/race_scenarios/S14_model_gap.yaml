# 형식: sil/vcan/fake_race_server.py 머리말. harness 는 r_race.py 용(재생기는 읽지 않음), vehicle = FakeVehicle 인자.
name: S14_model_gap
desc: Go 뒤 속도를 맞추고 모델 입력을 정해진 시간 끊는다. r_race.py 가 matrix 의 조합마다 duration_s 를 늘려 한 번씩 돌린다
duration_s: 6.0
events:
  - {t: 1.0, flag: go, mode: level}
harness:
  vehicle: {physics: true}
  matrix:
    gaps_s: [0.1, 0.2, 0.3, 0.6, 1.0]
    speeds_kph: [30.0, 9.0]     # 고속·저속. 저속 9 는 계획서 8.1 표의 예
    r_min_m: [null, 20.0]       # null = 모름(기본, a_err = 3.0), 20 = 계획서 8.1 표의 가정
  t_gap_after_go_s: 1.2
  model: {note: 속도 유지 명령, 끊김 동안 쓰지 않음}
  expect: 예산 안 = 복구, 밖 = 정지 확정(recovery.py 판정 그대로, 신선한 입력 3주기 확인 포함)
