# 형식: sil/vcan/fake_race_server.py 머리말. harness 는 r_race.py 용(재생기는 읽지 않음), vehicle = FakeVehicle 인자.
name: S11b_race_signal_lost_timeout
desc: 0x124 가 5 s 에 끊김, timeout 설정(1.0 s 는 시험용 값 — 대회 측 답변 전)
duration_s: 10.0
events:
  - {t: 1.0, flag: go, mode: level}
  - {t: 5.0, stream: race_signal, action: stop}
harness:
  vehicle: {physics: true}
  guard_args: ['--race-signal-timeout-s', '1.0']
  model: {note: 계속 가속 명령}
  expect: timeout 뒤 SUSPENDED
