# 형식: sil/vcan/fake_race_server.py 머리말. harness 는 r_race.py 용(재생기는 읽지 않음), vehicle = FakeVehicle 인자.
name: S02b_go_on_at_start
desc: 브리프 A1 — 첫 프레임부터 Go 가 이미 켜짐(재시작 직후의 옛 Go). 4 s 에 내렸다가 5 s 에 다시 올림
duration_s: 8.0
events:
  - {t: 0.0, flag: go, mode: level, until: 4.0}
  - {t: 5.0, flag: go, mode: level}
harness:
  vehicle: {physics: true}
  model: {note: 계속 가속 명령}
  expect: 0 을 본 뒤의 상승(5 s)에서만 RACING, 이벤트 race_signal 에 go_level_at_start 기록
