# 형식: sil/vcan/fake_race_server.py 머리말. harness 는 r_race.py 용(재생기는 읽지 않음), vehicle = FakeVehicle 인자.
name: S15_pre_go_gap
desc: 출발 대기 중 모델 입력이 1.5~2.5 s 끊겼다 돌아옴(--with-ros 는 뒤이어 3.5 s 에 NaN 0.2 s 로 어댑터 래치), 6 s 에 Go
duration_s: 8.5
events:
  - {t: 6.0, flag: go, mode: level}
harness:
  vehicle: {physics: true}
  model: {note: 계속 가속 명령, 정해진 구간만 끊김}
  expect: 래치 자동 해제, 재 arm, Go 로 출발
