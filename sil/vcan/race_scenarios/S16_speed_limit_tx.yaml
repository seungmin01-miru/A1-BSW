# 형식: sil/vcan/fake_race_server.py 머리말. harness 는 r_race.py 용(재생기는 읽지 않음), vehicle = FakeVehicle 인자.
name: S16_speed_limit_tx
desc: 0x203 tx on. Slow On/Off 로 값 변경, 8 s 에 차량 쪽 값이 저절로 어긋남(vehicle_events)
duration_s: 18.0
events:
  - {t: 1.0, flag: go, mode: level}
  - {t: 3.0, flag: slow_on, mode: level, until: 12.0}
  - {t: 12.0, flag: slow_off, mode: level, until: 14.0}
harness:
  # 해제값 100 은 시험용 — 업체 답변 대기(계획서 9.3).
  vehicle: {physics: true, speed_limit_kph: 100.0, speed_limit_latency_s: 0.05}
  vehicle_events:
    - {t: 8.0, force_speed_limit_kph: 100.0}
  guard_args: ['--speed-limit-tx', '--speed-limit-release-kph', '100']
  model: {note: 계속 가속 명령}
  expect: 3프레임 반영, 해제, 어긋남 재송신
