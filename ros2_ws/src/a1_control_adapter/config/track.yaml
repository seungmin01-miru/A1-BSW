# a1_control_adapter 트랙 설정 — 표는 전부 **잠정값**(10-07 리프트·10-08 주행 이미지 근거, docs/a1_vehicle_characteristics.md).
# 트랙에서 tools/track_day/TRACK_MANUAL.md T1~T4 로 실측해 고친다. 고친 뒤엔 어댑터만 재시작하면 된다.
a1_cmd_adapter:
  ros__parameters:
    can_guard_dir: ~/git/A1-BSW/safety/can_guard   # protocol.py 위치(구조체 정의 공유)
    cmd_shm: a1_can_guard_cmd
    hb_shm: a1_can_guard_perception_hb
    period_s: 0.02              # 공유메모리 기록 주기 — can_guard 워치독 50 ms 의 2.5배 여유
    stale_timeout_s: 0.15       # arm 중 제어기 입력이 이보다 오래 끊기면 고장 래치 → can_guard HOLDING
    perception_heartbeat: true  # 인지 프로세스가 생기면 false

    map_version: "steer-v1-bsw5-7pt / long-1d-hyst"   # 표 버전. /control/adapter/status 의 note 에 나온다

    # ── 조향: 타이어각 → 핸들각. 좌우 비대칭이면 점을 더 넣는다. x 는 오름차순.
    # 2026-11-04 bsw5 GNSS 요레이트 역산(★ 그래프 판독 — reports(log)/20261104_track/1_조향/P1_steer_ratio.png, 11-14 원 돌기로 교체).
    # 타이어 0 ↔ 핸들 −9°(핸들 0° 에서 타이어 +1.2° 좌 → 보고서 범위 −9~−13° 의 작은 쪽, 과보정 방지). 끝점은 평행 이동하지 않음.
    # 모델이 요청할 수 있는 최대 타이어각은 ±11.5° — 표 밖은 끝값 포화. 옛 표: config/steer_map_v0_20261104.yaml
    steer_sign: 1.0             # T1: 제어기 +(좌회전)일 때 0x200 위치가 + 로 가면 1, − 면 -1
    steer_map:
      tire_deg:  [-11.5, -8.5, -5.0, 0.0, 5.5, 9.0, 11.5]
      wheel_deg: [-150.0, -100.0, -50.0, -9.0, 50.0, 100.0, 150.0]
    steer_wheel_limit_deg: 150.0     # DBC 명령 한계. can_guard --steer-limit-deg 와 같게
    steer_rate_limit_deg_s: 120.0    # 핸들각 속도. 10-07 실측 액추에이터 최대 약 125 °/s

    # ── 종방향: 목표 가감속 → 가속 % / 브레이크 % (T3·T4 에서 실측)
    long_deadband_mps2: 0.1          # 진입: |a| 가 이보다 크면 가속/브레이크 모드
    long_deadband_off_mps2: 0.03     # 이탈: |a| 가 이보다 작으면 0. 그 사이는 이전 모드 유지(11-04 on/off 161회/분 해소, 지시서 2.6.2 b)
    # 가속: 2026-11-04 실차 평지 저속 1회씩(잠정, measurements/2026-11-04_signal_audit/quick_lon.md) —
    #   10~70 % 는 4~5 s 동안 출발 못 함(불감대), 80 % → 0.13 m/s², 100 % → 0.57 m/s²(0→3.5 km/h 1.9 s).
    #   이전 값(0.1→0 %, 1.3→30 %, 상한 30 %)으로는 차가 출발하지 못한다.
    accel_map:
      accel_mps2: [0.1, 0.13, 0.57]
      acc_pct:    [75.0, 80.0, 100.0]
    acc_max_pct: 100.0               # 11-04: 0.57 m/s² 이상은 100 % 포화
    # 브레이크: 10-08 이벤트 평균 감속(33~65 % → 0.4~1.7, 100 % → 최대 4.1 m/s²)을 부드럽게 이은 잠정 곡선
    brake_map:
      decel_mps2: [0.1, 1.0, 2.0, 3.0, 4.0]
      brake_pct:  [0.0, 40.0, 70.0, 90.0, 100.0]
    brake_max_pct: 100.0

    # ── 입력 거부 한계(이 밖이면 제어기 고장으로 보고 버림 + arm 중이면 고장 래치)
    input_accel_abs_mps2: 15.0
    input_steer_tire_abs_deg: 45.0
