# 종방향 2차원 표 — 지시서 2.2절. 행 = 차속 km/h, 열 = 목표 가감속 m/s². 양수 = 가속 %, 음수 = 브레이크 %, null = 미측정
# v1: 기존 1차원 표를 0~20 km/h 행에 복사(속도 구분 없음, 잠정). 30 km/h 이상은 미측정 → 20 km/h 값 + AdapterStatus.extrapolated.
# 열에 0.1·0.13·0.57 을 더한 것은 1차원 표의 꺾임점이라 그렇다 — 지금 동작과 같게 하려고(docs/engine_room_open_items.md E-10).
# 자동으로 고치지 않는다. tools/engine_room/fit_long_map.py 추천을 사람이 보고 고친 뒤 커밋, docs/engine_room_map_history.md 에 적는다.
