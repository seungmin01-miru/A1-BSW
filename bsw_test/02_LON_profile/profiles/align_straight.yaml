# 01 LAT-ALIGN 직진 — 핸들 0(+ --steer-offset) 고정, acc % 개루프로 코스 끝까지 → 끝내기(브레이크 100).
# 편도 1 회 = 세션 1 개. 반대 방향은 세션을 끝낸 뒤 사람이 차를 돌려 놓고 다시(자율 U턴 2026-11-06 폐기).
name: LAT-ALIGN-01
vars: {acc: 8, vmax: 20, course: 50}
limits: {steer_deg: 15, brake_pct: 100, acc_pct: $acc, max_speed_kph: $vmax}
course: {length_m: $course}
start: {steer: 0, brake: 30, acc: 0}
segments:
  - {type: set, brake: 0, t: 0.3, label: 브레이크풀기}
  - {type: step, axis: acc, to: $acc, t: 60, label: 직진}
end: {brake: 100, ramp_s: 2.5}
